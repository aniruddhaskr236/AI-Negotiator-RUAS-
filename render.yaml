services:
  - type: web
    name: bhaav
    runtime: python
    region: singapore
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: "pip install -r backend/requirements.txt && if [ -d frontend ]; then (cd frontend && npm ci && npm run build); fi"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20"
      - key: DB_PATH
        value: /tmp/bhaav.db
      - key: SCRIPTED_SHOPS
        value: "0"
      - key: DEMO_CONTROLS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
